spring.application.name=Proyecto_Reverdecer

# =========================================
# CONFIGURACIÓN JPA/HIBERNATE
# (DataSource configurado via DatabaseConfig.java)
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =========================================
# CONFIGURACIÓN LOGGING - DEBUG
# =========================================
logging.level.com.example.ReverdecerIA.controller.RutaController=TRACE
logging.level.com.example.ReverdecerIA.service.RutaService=DEBUG
logging.level.com.example.ReverdecerIA.service.impl.RutaServiceImpl=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.example.ReverdecerIA.service.CustomUserDetailsService=DEBUG

# =========================================
# CONFIGURACIÓN MENSAJES
# =========================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# =========================================
# CONFIGURACIÓN JACKSON
# =========================================
spring.jackson.serialization.indent_output=true
spring.jackson.serialization.fail-on-empty-beans=false

# =========================================
# CONFIGURACIÓN ERRORES
# =========================================
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================
# CONFIGURACIÓN SEGURIDAD PERSONALIZADA
# =========================================
app.roles.super-admin=ROLE_SUPER_ADMIN
app.roles.admin=ROLE_ADMIN
app.roles.encargado-productos=ROLE_ENCARGADO_PRODUCTOS
app.roles.encargado-ventas=ROLE_ENCARGADO_VENTAS
app.roles.cliente=ROLE_CLIENTE

# =========================================
# CONFIGURACIÓN ADICIONAL
# =========================================
server.servlet.context-path=/
server.max-http-header-size=8192
server.compression.enabled=false

